# =============================================================================
# V-SHAKE Configuration File
# NEO-MSDFT Constrained Seam Sampling
# =============================================================================

# --- Initial geometry (heavy atoms only, no quantum proton) ---
initial_geometry: "init_pos_example.xyz"

# Optional masses in AMU, same order as atoms in the XYZ file.
# If set to null, masses are inferred from XYZ element symbols using most common isotope masses 
masses_amu: null 

# --- Quantum proton basis center initial guesses (Angstrom) ---
# These are starting positions for the protonic basis center optimization.
# Donor: proton localized near the first oxygen
# Acceptor: proton localized near the second oxygen
proton_center_donor:    [0.0000000000, -0.3367648071, 2.3304949480]
proton_center_acceptor: [0.0000000000,  0.3367648071, 2.3304949480]

# --- Q-Chem interface ---
opt_template: "templates/opt.in"
msdft_template: "templates/msdft.in"
qchem_nprocs: 24
proton_center_indices: [1, 2]   # 1-based Q-Chem atom indices of H and @H in MSDFT job 3

# --- Dynamics parameters ---
target_temperature: 20.0        # Kelvin
# Initial velocities: "mb" (default), "file" (initial_velocity_path), or "nacv" (seam-tangent NACV)
initial_velocity_mode: "mb"
initial_velocity_path: null     # optional XYZ-like velocity file, units: Bohr / atomic unit of time
dt_fs: 0.1                      # time step in femtoseconds
constraint_threshold: 1.0e-7    # |sigma| threshold in Hartree 
max_shake_iter: 20              # max SHAKE root-search iterations per attempt (primary, each MB resample)

# Minimum donor/acceptor proton basis-center distance after diabat (SHAKE) search.
# Below this threshold triggers Maxwell-Boltzmann velocity resample recovery. Set to null to disable.
min_proton_center_separation_angstrom: 0.75

# After a failed SHAKE step, stay at the current geometry and draw new seam-projected
# Maxwell-Boltzmann velocities (rescaled to preserve instantaneous temperature) up to
# this many times before terminating the trajectory.
max_mb_resamples: 20

thermostat: "berendsen"         # "berendsen" or "none"
thermostat_tau_fs: 2.0          # Berendsen time constant in fs

# --- Simulation length ---
n_steps: 100                    # number of V-SHAKE steps (set low for testing)
save_interval: 1                # save trajectory frame every N steps

# --- Output ---
trajectory_path: "trajectory.npz"
seam_xyz_path: "seam_geometries.xyz"
save_qchem_outputs: true
output_dir: "output"
log_filename: "output.log"
msdft_subdir: "msdft"
opt_subdir: "opt"
