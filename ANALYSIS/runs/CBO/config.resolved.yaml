  D: /gpfs/gibbs/pi/hammes_schiffer/jad279/BOUCHET/projects/VSHAKE/TRAJS/xDENPLT/OUTPUT/CBO_D.cube
master_xyz:
  x_lim:
  - 0.0
  - 60.0
  y_lim:
  - 1.0
  - 300.0
  log_minor_ticks: true
  yscale: log
sir:
  nslices: 10
  var: 0.99
  n_eigenvalues_plot: 10
  n_eigenvectors_viz: 3
sir_viz:
  arrow_scale: 3.0
  arrow_color:
    H: '#d62728'
    D: '#1f77b4'
  gperp_color: '#2ca02c'
  gradv_color: '#ff7f0e'
  arrow_mol_transparency: 0.2
  amplitude: 0.5
  n_frames: 24
  zoom_center: 3.25
  turn_x: 0.0
  turn_y: 270.0
  turn_z: 180.0
  png_width: 2000
  png_height: 1400
  png_dpi: 600
  ray: 1
  gif_delay: 5
  gif_loop: 0
  gif_extra_args: ''
  density:
    root: TRAJS/xDENPLT/OUTPUT
    isovalue: 0.04
    color:
    - 128
    - 229
    - 255
    paths: {}
  cos_barchart_xlim:
  - -0.5
  - 13.5
  cos_barchart_ylim: null
  per_isotope:
    H: {}
    D: {}
  per_vector:
    sir:
      amplitude: 0.5
    gperp:
      amplitude: 0.2
    gradv:
      amplitude: 0.2
qchem_mecp:
  temp: HIGH_TEMP
  batch: BATCH1
n_skip_rows: 2
geom:
  observables:
  - id: RCO
    type: bond
    indices:
    - 1
    - 2
    label: $R_{\mathrm{CO}}$
  - id: cn_bend
    type: angle
    indices:
    - 1
    - 10
    - 11
    label: CN Bend
  plots:
  - x_id: RCO
    y_field: vibronic_coupling
    label: $V$
    output: V_vs_RCO.png
    xlim:
    - 2.6
    - 3.0
    ylim:
    - 1
    - 300
  - x_id: RCO
    y_field: delta_E_kcal
    label: $\Delta E_{\mathrm{seam}}$
    output: deltaE_vs_RCO.png
    xlim:
    - 2.6
    - 3.0
    ylim:
    - 0
    - 60
  - x_id: cn_bend
    y_field: vibronic_coupling
    label: $V$
    output: V_vs_cn_bend.png
    xlim:
    - 140
    - 180
    ylim: null
  - x_id: RCO
    y_id: cn_bend
    color: vibronic_coupling
    label: $V$
    output: coupling_map_RCO_vs_cn_bend.png
    xlim:
    - 2.6
    - 3.0
    ylim:
    - 140
    - 180
    clim: null
  plot_defaults:
    xlim: null
    ylim: null
    clim: null
    yscale: log
  write_table: false
  table_path: geom_scatter_table.txt
  plot_1d_hist_splines: false
