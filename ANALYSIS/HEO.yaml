run_name: HEO
# Relative paths resolve against the project root (the parent of this analysis
# directory), so renaming or moving the analysis directory needs no edits here.
trajectory_root: TRAJS/HEO

temps:
  - HIGH_TEMP
  - LOW_TEMP
isotopes:
  - H
  - D

master_xyz:
  x_lim: [0, 60]
  y_lim: [1, 1400]
  log_minor_ticks: true
  yscale: log

sir:
  nslices: 10
  var: 0.99
  n_eigenvalues_plot: 3    # eigenvalues on the step-3 bar chart
  n_eigenvectors_viz: 3    # eigenvectors rendered in step 4
  noise_floor: 1.0              # cm^-1; frames with V < this dropped for filtered/bootstrap
  bootstrap_fractions: [0.75, 0.85]
  bootstrap_n: 100
  bootstrap_seed: 0             # reproducible RNG
  bootstrap_combo_spectrum: true  # one H/D+fractions combo plot instead of per-fraction combo charts
  viz_source: filtered          # filtered | all  -> which NPZ sir_viz reads

qchem_mecp:
  temp: HIGH_TEMP
  batch: BATCH1
n_skip_rows: 2

sir_viz:
  arrow_scale: 3.0
  arrow_color:
    H: "#d62728"
    D: "#1f77b4"
  gperp_color: "#2ca02c"
  gradv_color: "#ff7f0e"
  arrow_mol_transparency: 0.2
  amplitude: 0.5
  n_frames: 24
  zoom_center: 3.0
  turn_x: 0
  turn_y: 0
  turn_z: 0
  png_width: 2000
  png_height: 1400
  png_dpi: 600
  ray: 1
  gif_delay: 5
  gif_loop: 0
  gif_extra_args: ""
  density:
    root: TRAJS/xDENPLT/OUTPUT
    isovalue: 0.04
    color: [128, 229, 255]
  cos_barchart:
    xlim: [-0.5, 10.5]
    ylim: null
  per_vector:
    sir:
      amplitude: 0.50
    gperp:
      amplitude: 0.20
    gradv:
      amplitude: 0.20
  per_isotope:
    H:
      turn_x: 0
      turn_y: 0
      turn_z: 0
    D:
      turn_x: 0
      turn_y: 180
      turn_z: 0

geom:
  observables:
    - id: ROO
      type: bond
      indices: [1, 2]
      label: '$R_{\mathrm{OO}}$'
  plot_defaults:
    xlim: null
    ylim: null
    clim: null
    yscale: log
  plots:
    - x_id: ROO
      y_field: vibronic_coupling
      label: '$V$'
      output: V_vs_ROO.png
      xlim: [2.35, 2.75]
      ylim: [1, 1400]
    - x_id: ROO
      y_field: delta_E_kcal
      label: '$\Delta E_{\mathrm{seam}}$'
      output: deltaE_vs_ROO.png
      xlim: [2.35, 2.75]
      ylim: null
  write_table: false
  plot_1d_hist_splines: false
